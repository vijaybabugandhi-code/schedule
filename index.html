  btn.disabled = true; btn.textContent = "Decrypting...";
  try{
    var all = b64ToBytes(PAYLOAD);
    var salt = all.slice(0,16), iv = all.slice(16,28), ct = all.slice(28);
    var pw = document.getElementById("pw").value;
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:ITER, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct);
    var html = new TextDecoder().decode(plain);
    try{
      document.open(); document.write(html); document.close();
    }catch(e2){
      // sandboxed viewers that block document.write: swap the DOM instead
      document.documentElement.innerHTML = html.replace(/^[\s\S]*?<html[^>]*>/i,"").replace(/<\/html>\s*$/i,"");
      var scripts = document.querySelectorAll("script");
      for(var i=0;i<scripts.length;i++){
        var ns = document.createElement("script");
        ns.textContent = scripts[i].textContent;
        scripts[i].parentNode.replaceChild(ns, scripts[i]);
      }
    }
  }catch(ex){
    var msg = (ex && ex.name === "OperationError") ? "Wrong password. Try again."
            : "Could not decrypt here (" + (ex && ex.name || "error") + "). Open the published link or download the file and open it in your browser.";
    err.textContent = msg;
    btn.disabled = false; btn.textContent = "Open report";
  }
}
document.getElementById("btn").addEventListener("click", openReport);
document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); openReport(); } });
</script>
